[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mingli-calendrical"
version = "0.1.0"
description = "Historical DST + true-solar-time engine for Chinese metaphysics apps (HK/MO/TW/CN 1941-1991)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ming Luo Pan", email = "support@purpleking.net" }]
keywords = ["dst", "solar-time", "chinese-astrology", "bazi", "ziwei", "hong-kong"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Religion",
]

[project.urls]
Homepage = "https://purpleking.net"
Demo = "https://purpleking.net/ziwei"

[tool.setuptools.packages.find]
include = ["mingli_calendrical*"]

[tool.setuptools.package-data]
mingli_calendrical = ["data/*.json"]
